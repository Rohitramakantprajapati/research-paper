name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  monograph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-publishers
      - name: Build monograph PDF
        run: latexmk -pdf monograph.tex
      - name: Upload monograph PDF
        uses: actions/upload-artifact@v4
        with:
          name: monograph-pdf
          path: monograph.pdf

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Lean package
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean_package
      - name: Check every Lean source file
        shell: bash
        working-directory: lean_package
        run: |
          set -euo pipefail
          mapfile -t sources < <(find . -path './.lake' -prune -o -type f -name '*.lean' -print | sort)
          for source in "${sources[@]}"; do
            echo "::group::Checking ${source#./}"
            lake env lean "$source"
            echo "::endgroup::"
          done
