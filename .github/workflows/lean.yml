name: CI

on:
  push:
    branches: [ "master", "main", "repo-cleanup" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  lean:
    name: Build Lean 4 Formalization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Verify Lean and Lake versions
        run: |
          cd lean
          lean --version
          lake --version

      - name: Fetch Mathlib cache
        run: |
          cd lean
          lake exe cache get

      - name: Build Lean package
        run: |
          cd lean
          lake build

      - name: Audit axioms (Zero sorry check)
        run: |
          cd lean
          lake env lean AxiomCheck.lean

  paper:
    name: Compile LaTeX Paper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live
        uses: teatimeguest/setup-texlive@v3
        with:
          packages: |
            scheme-basic
            amscls
            amsfonts
            amsmath
            geometry
            enumitem
            cite
            booktabs
            hyperref
            etoolbox
            kvoptions
            url

      - name: Compile LaTeX monograph
        run: |
          mkdir -p paper/build
          cd paper
          pdflatex -interaction=nonstopmode -output-directory=build monograph.tex
          pdflatex -interaction=nonstopmode -output-directory=build monograph.tex

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: monograph-pdf
          path: paper/build/monograph.pdf
          if-no-files-found: error
